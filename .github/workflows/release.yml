name: Release

# Cuts a release: works out the next version, writes the notes from the
# commits behind it, builds the DMG, adds it to the Sparkle feed, tags it and
# publishes it.
#
# Run it from the Actions tab. "auto" reads the commits since the last tag —
# a `feat:` makes it a minor release, a `!` or a BREAKING CHANGE trailer a
# major one, anything else a patch — and the choice is printed in the job
# summary alongside what each of the three would have given. Pick patch, minor
# or major explicitly to overrule it, or tick "dry run" to see the version,
# the notes and the built DMG without publishing anything.
#
# Every secret below is optional, and the run degrades rather than stopping:
# without a certificate the app is signed ad-hoc, without notarization
# credentials it ships un-notarized, without the Sparkle key the feed is left
# alone so no installed copy is offered an update it cannot verify. What the
# run could not do is said in the job summary and at the top of the release
# notes, so a half-signed build is never mistaken for a full one.
#
#   MACOS_CERTIFICATE_P12       Developer ID Application certificate, .p12,
#                               base64-encoded (`base64 -i cert.p12 | pbcopy`)
#   MACOS_CERTIFICATE_PASSWORD  the password that .p12 was exported with
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_TEAM_ID               the team the certificate belongs to
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID
#   SPARKLE_ED_PRIVATE_KEY      Sparkle's EdDSA private key, the one whose
#                               public half is SUPublicEDKey in project.yml

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      dry_run:
        description: "Build and show the result without tagging or publishing"
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the version and the notes can be read from it.
          fetch-depth: 0

      - name: Fetch the release tags
        run: git fetch --force --tags

      - name: Work out the version
        id: version
        run: ./scripts/release/version.sh "${{ inputs.bump }}" | tee -a "$GITHUB_OUTPUT"

      - name: Refuse to release a version that already exists
        run: |
          version="${{ steps.version.outputs.next }}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged."
            exit 1
          fi

      - name: Work out what this run can sign with
        id: can
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          cert=false
          notarize=false
          sparkle=false
          if [ -n "$CERTIFICATE_P12" ]; then cert=true; fi
          # Notarization is Apple checking a Developer ID signature, so it is
          # only on the table when there is one.
          if [ "$cert" = true ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            notarize=true
          fi
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then sparkle=true; fi

          {
            echo "cert=$cert"
            echo "notarize=$notarize"
            echo "sparkle=$sparkle"
          } >> "$GITHUB_OUTPUT"

          echo "Developer ID certificate: $cert"
          echo "Notarization credentials:  $notarize"
          echo "Sparkle signing key:       $sparkle"
          if [ "$cert" = false ]; then
            echo "::warning::No Developer ID — the app will be signed ad-hoc and Gatekeeper will refuse it."
          elif [ "$notarize" = false ]; then
            echo "::warning::No notarization credentials — the DMG will ship un-notarized."
          fi
          if [ "$sparkle" = false ]; then
            echo "::warning::No Sparkle key — appcast.xml will be left alone, so installed copies will not be offered this update."
          fi

      - name: Write the release notes
        run: |
          range="${{ steps.version.outputs.range }}"
          ./scripts/release/changelog.py --range "$range" --format markdown > "$RUNNER_TEMP/notes.md"
          ./scripts/release/changelog.py --range "$range" --format html > "$RUNNER_TEMP/notes.html"

          # A build that Gatekeeper will stop, or that no installed copy will
          # be offered, has to say so where the person downloading it looks.
          caveats=""
          if [ "${{ steps.can.outputs.cert }}" != "true" ]; then
            caveats+=$'> **This build is not signed with a Developer ID.** macOS will refuse to open it until you remove the quarantine flag: `xattr -dr com.apple.quarantine /Applications/ClaudePulse.app`.\n\n'
          elif [ "${{ steps.can.outputs.notarize }}" != "true" ]; then
            caveats+=$'> **This build is signed but not notarized.** macOS will warn the first time it opens; right-click the app and choose Open to get past it.\n\n'
          fi
          if [ "${{ steps.can.outputs.sparkle }}" != "true" ]; then
            caveats+=$'> **Not published to the update feed.** Existing installations will not be offered this version; download it here instead.\n\n'
          fi
          if [ -n "$caveats" ]; then
            printf '%s' "$caveats" | cat - "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes.full.md"
            mv "$RUNNER_TEMP/notes.full.md" "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Say what this release would be
        run: |
          {
            echo "## ClaudePulse ${{ steps.version.outputs.next }}"
            echo
            echo "| | version |"
            echo "|---|---|"
            echo "| current | ${{ steps.version.outputs.current }} |"
            echo "| patch | ${{ steps.version.outputs.patch }} |"
            echo "| minor | ${{ steps.version.outputs.minor }} |"
            echo "| major | ${{ steps.version.outputs.major }} |"
            echo
            echo "Asked for **${{ steps.version.outputs.requested }}**, commits suggest"
            echo "**${{ steps.version.outputs.suggested }}**, releasing as a"
            echo "**${{ steps.version.outputs.bump }}** bump from"
            echo "${{ steps.version.outputs.commits }} commits."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Developer ID signing | ${{ steps.can.outputs.cert == 'true' && 'yes' || 'no — ad-hoc' }} |"
            echo "| Notarized | ${{ steps.can.outputs.notarize == 'true' && 'yes' || 'no' }} |"
            echo "| Added to the update feed | ${{ steps.can.outputs.sparkle == 'true' && 'yes' || 'no' }} |"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo
              echo "> Dry run — nothing will be published."
            fi
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the tests
        run: swift test

      - name: Set the version
        run: |
          version="${{ steps.version.outputs.next }}"
          ./scripts/release/set-version.sh "$version"
          echo "DMG=build/ClaudePulse-$version.dmg" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        if: steps.can.outputs.cert == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # The default search list too, so codesign finds the identity.
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in that certificate."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as $identity"

      - name: Build the DMG
        env:
          VERSION: ${{ steps.version.outputs.next }}
          # Without a certificate the build signs ad-hoc rather than stopping.
          ALLOW_ADHOC_SIGN: ${{ steps.can.outputs.cert == 'true' && '0' || '1' }}
          SKIP_NOTARIZE: ${{ steps.can.outputs.notarize == 'true' && '0' || '1' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-dmg.sh

      - name: Sign the DMG for Sparkle
        id: sparkle
        if: steps.can.outputs.sparkle == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Sparkle ships sign_update inside the binary artifact SwiftPM fetched.
          sign_update="$(find .build/artifacts -name sign_update -type f -perm -u+x | head -n1)"
          if [ -z "$sign_update" ]; then
            echo "::error::sign_update not found in .build/artifacts."
            exit 1
          fi
          # Prints `sparkle:edSignature="..." length="..."`.
          attributes="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$DMG")"
          signature="$(sed -n 's/.*edSignature="\([^"]*\)".*/\1/p' <<< "$attributes")"
          if [ -z "$signature" ]; then
            echo "::error::sign_update produced no signature."
            exit 1
          fi
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

      - name: Add the release to the appcast
        if: steps.can.outputs.sparkle == 'true'
        run: |
          version="${{ steps.version.outputs.next }}"
          ./scripts/release/update-appcast.py \
            --version "$version" \
            --dmg "$DMG" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$version/ClaudePulse-$version.dmg" \
            --signature "${{ steps.sparkle.outputs.signature }}" \
            --notes-file "$RUNNER_TEMP/notes.html"
          git --no-pager diff --stat

      - name: Keep the dry run's build
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: ClaudePulse-${{ steps.version.outputs.next }}-dry-run
          path: |
            ${{ env.DMG }}
            appcast.xml
          retention-days: 7

      - name: Commit the version and the feed
        if: ${{ !inputs.dry_run }}
        run: |
          version="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # appcast.xml is only in this commit when the feed was updated.
          git add project.yml appcast.xml
          git commit -m "release: v$version"
          git tag -a "v$version" -m "ClaudePulse $version"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$version"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.next }}"
          gh release create "v$version" \
            "$DMG" \
            --title "ClaudePulse $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ inputs.prerelease && '--prerelease' || '' }}

      - name: Clean up the signing keychain
        if: always()
        run: |
          security list-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
